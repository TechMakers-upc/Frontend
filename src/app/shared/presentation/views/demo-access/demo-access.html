<main class="demo-page">
  <section class="demo-card" aria-labelledby="demo-title">
    <header class="demo-topbar">
      <div class="demo-brand">
        <app-brand-mark [size]="36" />
        <span class="demo-wordmark">FIX<span>CORE</span></span>
      </div>
      <app-language-switcher />
    </header>

    <p class="demo-eyebrow">{{ 'demoAccess.eyebrow' | translate }}</p>
    <h1 id="demo-title">{{ 'demoAccess.title' | translate }}</h1>
    <p class="demo-intro">{{ 'demoAccess.intro' | translate }}</p>
    <h2 class="demo-subtitle">{{ 'demoAccess.selectProfile' | translate }}</h2>

    <div class="demo-options">
      <button type="button" class="demo-option" (click)="choose('plant-manager')">
        <span class="demo-option__icon"><app-icon name="factory" [size]="28" /></span>
        <span class="demo-option__text">
          <strong>{{ 'roles.plant-manager.title' | translate }}</strong>
          <small>{{ 'demoAccess.plantManagerHint' | translate }}</small>
        </span>
        <app-icon name="arrow-right" [size]="20" />
      </button>
      <button type="button" class="demo-option" (click)="choose('operations-manager')">
        <span class="demo-option__icon"><app-icon name="dashboard" [size]="28" /></span>
        <span class="demo-option__text">
          <strong>{{ 'roles.operations-manager.title' | translate }}</strong>
          <small>{{ 'demoAccess.operationsManagerHint' | translate }}</small>
        </span>
        <app-icon name="arrow-right" [size]="20" />
      </button>
      <button type="button" class="demo-option" (click)="choose('technician')">
        <span class="demo-option__icon"><app-icon name="wrench" [size]="28" /></span>
        <span class="demo-option__text">
          <strong>{{ 'roles.technician.title' | translate }}</strong>
          <small>{{ 'demoAccess.technicianHint' | translate }}</small>
        </span>
        <app-icon name="arrow-right" [size]="20" />
      </button>
    </div>
    <p class="demo-footnote">{{ 'demoAccess.footnote' | translate }}</p>
    <a class="demo-login-link" routerLink="/login">{{ 'demoAccess.backToLogin' | translate }}</a>
  </section>
</main>
