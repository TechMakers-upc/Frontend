<div class="work-order-list-container">
  <h2>Órdenes de Trabajo Asignadas</h2>
  <table class="ot-table">
    <thead>
    <tr>
      <th>ID</th>
      <th>Máquina</th>
      <th>Prioridad</th>
      <th>Estado</th>
      <th>Técnico</th>
      <th>Acción</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let ot of workOrders">
      <td>{{ ot.id }}</td>
      <td>{{ ot.machine }}</td>
      <td><span [class]="'badge ' + ot.priority.toLowerCase()">{{ ot.priority }}</span></td>
      <td><span [class]="'status ' + ot.status.toLowerCase()">{{ ot.status }}</span></td>
      <td>{{ ot.technician }}</td>
      <td>
        <button class="btn-action" (click)="selectOrder(ot)">Ver Detalle / Ejecutar</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
