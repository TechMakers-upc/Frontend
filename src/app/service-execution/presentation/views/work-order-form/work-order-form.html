<app-page-header
  [heading]="(editing() ? 'workOrders.editTitle' : 'workOrders.newTitle') | translate: { code: editing()?.code }"
  [subtitle]="
    failure()
      ? ('workOrders.fromFailure' | translate)
      : plan()
        ? ('workOrders.fromPlan' | translate: { title: plan()!.title })
        : ('workOrders.formHint' | translate)
  "
  [backLink]="editing() ? ['/work-orders', editing()!.id] : '/work-orders'"
/>

<form class="card form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="form-grid form-grid--two">
    <app-field for="wo-type" [label]="'workOrders.type' | translate" [floating]="true">
      <select id="wo-type" appFieldInput formControlName="type">
        @for (type of types; track type) {
          <option [value]="type">{{ 'workOrderType.' + type | translate }}</option>
        }
      </select>
    </app-field>

    <app-field for="wo-asset" [label]="'workOrders.machine' | translate" [floating]="true">
      <select id="wo-asset" appFieldInput formControlName="assetId">
        <option value="" disabled>{{ 'workOrders.pickMachine' | translate }}</option>
        @for (group of assetGroups(); track group.plant?.id) {
          <optgroup [label]="group.plant?.displayName ?? ''">
            @for (asset of group.assets; track asset.id) {
              <option [value]="asset.id">{{ asset.code }} · {{ asset.name }}</option>
            }
          </optgroup>
        }
      </select>
    </app-field>

    <app-field class="form-grid__full" for="wo-title" [label]="'workOrders.titleField' | translate">
      <input id="wo-title" appFieldInput formControlName="title" />
    </app-field>

    <app-field class="form-grid__full" for="wo-description" [label]="'workOrders.description' | translate">
      <textarea id="wo-description" appFieldInput formControlName="description" rows="4"></textarea>
    </app-field>

    <app-field for="wo-priority" [label]="'workOrders.priority' | translate" [floating]="true">
      <select id="wo-priority" appFieldInput formControlName="priority">
        @for (priority of priorities; track priority) {
          <option [value]="priority">{{ 'priority.' + priority | translate }}</option>
        }
      </select>
    </app-field>

    <app-field for="wo-due" [label]="'workOrders.due' | translate" [floating]="true">
      <input id="wo-due" appFieldInput type="date" formControlName="dueDate" />
    </app-field>

    <app-field class="form-grid__full" for="wo-technician" [label]="'workOrders.assignTo' | translate" [floating]="true"
      [hint]="technicians().length === 0 ? ('workOrders.noTechnicians' | translate) : null">
      <select id="wo-technician" appFieldInput formControlName="technicianId">
        <option value="">{{ 'workOrders.assignLater' | translate }}</option>
        @for (tech of technicians(); track tech.id) {
          <option [value]="tech.id">{{ tech.fullName }} · {{ tech.jobTitle }}</option>
        }
      </select>
    </app-field>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn--ghost" (click)="router.navigateByUrl(editing() ? '/work-orders/' + editing()!.id : '/work-orders')">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn--primary" [disabled]="saving()">
      @if (saving()) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ (editing() ? 'common.saveChanges' : 'workOrders.create') | translate }}
    </button>
  </div>
</form>
