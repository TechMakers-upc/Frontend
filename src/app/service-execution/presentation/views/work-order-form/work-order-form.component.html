<div class="work-order-container">
  <h2>Crear Orden de Trabajo Correctiva</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="machineId">ID de Máquina / Activo:</label>
      <input type="text" id="machineId" [(ngModel)]="workOrder.machineId" name="machineId" required placeholder="Ej. INY-01">
    </div>

    <div class="form-group">
      <label for="description">Descripción de la Falla:</label>
      <textarea id="description" [(ngModel)]="workOrder.description" name="description" required placeholder="Detalle el problema detectado..."></textarea>
    </div>

    <div class="form-group">
      <label for="priority">Prioridad:</label>
      <select id="priority" [(ngModel)]="workOrder.priority" name="priority">
        <option value="CRITICAL">Crítica (Parada de línea)</option>
        <option value="HIGH">Alta</option>
        <option value="MEDIUM">Media</option>
      </select>
    </div>

    <div class="form-group">
      <label for="technician">Asignar Técnico:</label>
      <input type="text" id="technician" [(ngModel)]="workOrder.assignedTechnician" name="assignedTechnician" required placeholder="Nombre del técnico responsable">
    </div>

    <button type="submit" class="btn-primary">Generar y Asignar OT</button>
  </form>
</div>
