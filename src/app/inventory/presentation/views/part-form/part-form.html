<app-page-header
  [heading]="(editing() ? 'inventory.editTitle' : 'inventory.newTitle') | translate"
  [subtitle]="'inventory.formHint' | translate"
  [backLink]="editing() ? ['/inventory', editing()!.id] : '/inventory'"
/>

<form class="card form-card" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="form-grid form-grid--two">
    <app-field for="part-sku" label="SKU">
      <input id="part-sku" appFieldInput formControlName="sku" autocomplete="off" />
    </app-field>
    <app-field for="part-name" [label]="'inventory.part' | translate">
      <input id="part-name" appFieldInput formControlName="name" />
    </app-field>
    <app-field for="part-category" [label]="'inventory.category' | translate" [floating]="true">
      <select id="part-category" appFieldInput formControlName="category">
        @for (c of categories; track c) {
          <option [value]="c">{{ 'partCategory.' + c | translate }}</option>
        }
      </select>
    </app-field>
    <app-field for="part-unit" [label]="'inventory.unit' | translate" [floating]="true">
      <select id="part-unit" appFieldInput formControlName="unit">
        @for (u of units; track u) {
          <option [value]="u">{{ 'unit.' + u | translate }}</option>
        }
      </select>
    </app-field>
    <app-field for="part-min" [label]="'inventory.min' | translate" [hint]="'inventory.minHint' | translate">
      <input id="part-min" appFieldInput type="number" min="0" step="1" inputmode="numeric" formControlName="minStock" />
    </app-field>
    @if (!editing()) {
      <app-field for="part-initial" [label]="'inventory.initialStock' | translate">
        <input id="part-initial" appFieldInput type="number" min="0" step="1" inputmode="numeric" formControlName="initialStock" />
      </app-field>
    }
    <app-field class="form-grid__full" for="part-location" [label]="'inventory.location' | translate" [hint]="'inventory.locationHint' | translate">
      <input id="part-location" appFieldInput formControlName="location" />
    </app-field>
  </div>
  <div class="form-actions">
    <button type="button" class="btn btn--ghost" (click)="router.navigateByUrl(editing() ? '/inventory/' + editing()!.id : '/inventory')">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn--primary" [disabled]="saving()">
      @if (saving()) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ (editing() ? 'common.saveChanges' : 'inventory.register') | translate }}
    </button>
  </div>
</form>
